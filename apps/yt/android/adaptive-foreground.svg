<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- ImadLabs app icon (yt). Edit the "glyph" group to customise the symbol.
       The "background" group is swapped out automatically for iOS (full bleed) and Android adaptive layers. -->
  <defs>
    <linearGradient id="cobalt" gradientUnits="userSpaceOnUse" x1="300" y1="250" x2="740" y2="760">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="mint" gradientUnits="userSpaceOnUse" x1="280" y1="250" x2="760" y2="820">
      <stop offset="0%" stop-color="#00FFC2"/>
      <stop offset="100%" stop-color="#00D285"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#111C33"/>
      <stop offset="100%" stop-color="#070B14"/>
    </radialGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g id="background"></g>
  <g id="glyph">
    <!-- Video screen -->
    <rect x="232" y="330" width="560" height="380" rx="110" fill="url(#cobalt)"/>
    <!-- Play -->
    <path d="M 465 430 L 465 610 L 615 520 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="36" stroke-linejoin="round"/>
    <!-- Mint underline -->
    <rect x="372" y="770" width="280" height="34" rx="17" fill="url(#mint)" filter="url(#glow)"/>
    <!-- ImadLabs quantum dot (brand signature) -->
    <circle cx="780" cy="270" r="46" fill="#00FFC2" filter="url(#glow)"/>
    <circle cx="780" cy="270" r="20" fill="#FFFFFF"/>
  </g>
</svg>
