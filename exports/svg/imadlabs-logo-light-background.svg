<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><rect width="100%" height="100%" fill="#F8FAFC"/><g transform="translate(90, 85)"><g transform="scale(1.05)">
    <defs>
        <!-- Facet Gradients -->
        <linearGradient id="lux_top" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284C7"/>
            <stop offset="100%" stop-color="#0369A1"/>
        </linearGradient>
        <linearGradient id="lux_left" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0369A1"/>
            <stop offset="100%" stop-color="#075985"/>
        </linearGradient>
        <linearGradient id="lux_right" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2563EB"/>
            <stop offset="100%" stop-color="#0284C7"/>
        </linearGradient>
        
        <!-- L-Conduit Gradient -->
        <linearGradient id="lux_l_grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00F5A0"/>
            <stop offset="50%" stop-color="#0066FF"/>
            <stop offset="100%" stop-color="#00D285"/>
        </linearGradient>

        <!-- Ambient Glow Filter -->
        <filter id="lux_mint_glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="7" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
        <filter id="lux_dot_pulse" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="9" result="pulse"/>
            <feComposite in="SourceGraphic" in2="pulse" operator="over"/>
        </filter>
    </defs>

    <g id="hexacore-master-luxury">
        <!-- 3D Shadow Base Elevation -->
        <g class="imadlabs-mark" transform="translate(20.00 20.00) scale(1.0000)"><defs><linearGradient id="ilm39g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00C98A"/><stop offset="1" stop-color="#0066FF"/></linearGradient><filter id="ilm39f" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><circle cx="42" cy="28" r="18" fill="#00C98A"/><circle cx="42" cy="28" r="8" fill="#FFFFFF"/><path d="M 42 76 L 42 172 L 122 172" fill="none" stroke="url(#ilm39g)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path d="M 42 80 L 42 168 L 118 168" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
    </g>
    </g>
    <g transform="translate(250, 120)">
        <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="68" font-weight="800" letter-spacing="-0.8" fill="#0F172A">Imad<tspan fill="#0066FF">Labs</tspan></text>
        <text x="2" y="29.92" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="19.040000000000003" font-weight="700" letter-spacing="4.8" fill="#475569">SOFTWARE STUDIO</text>
    </g>
    </g></svg>