<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- ImadLabs app icon (template). Edit the "glyph" group to customise the symbol.
       The "background" group is swapped out automatically for iOS (full bleed) and Android adaptive layers. -->
  <defs>
    <linearGradient id="cobalt" gradientUnits="userSpaceOnUse" x1="300" y1="250" x2="740" y2="760">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="mint" gradientUnits="userSpaceOnUse" x1="280" y1="250" x2="760" y2="820">
      <stop offset="0%" stop-color="#00FFC2"/>
      <stop offset="100%" stop-color="#00D285"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#111C33"/>
      <stop offset="100%" stop-color="#070B14"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g id="background">
    <rect width="1024" height="1024" rx="224" fill="url(#bgGlow)"/>
    <rect x="6" y="6" width="1012" height="1012" rx="218" fill="none" stroke="#1E293B" stroke-width="4"/>
  </g>
  <g id="glyph">
    <!-- ImadLabs "iL" monogram: quantum dot (i) + kinetic L. Replace with your app's symbol. -->
    <path d="M 430 400 L 430 760 L 690 760" fill="none" stroke="url(#mint)" stroke-width="96" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M 430 410 L 430 752 L 680 752" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- ImadLabs quantum dot (brand signature) -->
    <circle cx="430" cy="250" r="46" fill="#00FFC2" filter="url(#glow)"/>
    <circle cx="430" cy="250" r="20" fill="#FFFFFF"/>
  </g>
</svg>
