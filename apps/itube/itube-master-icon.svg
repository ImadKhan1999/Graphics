<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- ImadLabs app icon (itube). Edit the "glyph" group to customise the symbol.
       The "background" group is swapped out automatically for iOS (full bleed) and Android adaptive layers. -->
  <defs>
    <linearGradient id="cobalt" gradientUnits="userSpaceOnUse" x1="300" y1="250" x2="740" y2="760">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="mint" gradientUnits="userSpaceOnUse" x1="280" y1="250" x2="760" y2="820">
      <stop offset="0%" stop-color="#00FFC2"/>
      <stop offset="100%" stop-color="#00D285"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#111C33"/>
      <stop offset="100%" stop-color="#070B14"/>
    </radialGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g id="background">
    <rect width="1024" height="1024" rx="224" fill="url(#bgGlow)"/>
    <rect x="6" y="6" width="1012" height="1012" rx="218" fill="none" stroke="#1E293B" stroke-width="4"/>
  </g>
  <g id="glyph">
    <!-- Play symbol -->
    <path d="M 405 300 L 405 660 L 725 480 Z" fill="url(#cobalt)" stroke="url(#cobalt)" stroke-width="70" stroke-linejoin="round"/>
    <!-- Download progress bar -->
    <rect x="300" y="790" width="424" height="36" rx="18" fill="#1E293B"/>
    <rect x="300" y="790" width="290" height="36" rx="18" fill="url(#mint)" filter="url(#glow)"/>
    <!-- ImadLabs quantum dot (brand signature) -->
    <circle cx="730" cy="270" r="46" fill="#00FFC2" filter="url(#glow)"/>
    <circle cx="730" cy="270" r="20" fill="#FFFFFF"/>
  </g>
</svg>
