<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200"><rect width="100%" height="100%" fill="#070B14"/><g transform="translate(35, 30)"><g transform="scale(0.68)">
    <defs>
        <!-- Facet Gradients -->
        <linearGradient id="lux_top" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38BDF8"/>
            <stop offset="100%" stop-color="#0284C7"/>
        </linearGradient>
        <linearGradient id="lux_left" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284C7"/>
            <stop offset="100%" stop-color="#0B1930"/>
        </linearGradient>
        <linearGradient id="lux_right" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0066FF"/>
            <stop offset="100%" stop-color="#0284C7"/>
        </linearGradient>
        
        <!-- L-Conduit Gradient -->
        <linearGradient id="lux_l_grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00FFC2"/>
            <stop offset="50%" stop-color="#00F5A0"/>
            <stop offset="100%" stop-color="#00D285"/>
        </linearGradient>

        <!-- Ambient Glow Filter -->
        <filter id="lux_mint_glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="7" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
        <filter id="lux_dot_pulse" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="9" result="pulse"/>
            <feComposite in="SourceGraphic" in2="pulse" operator="over"/>
        </filter>
    </defs>

    <g id="hexacore-master-luxury">
        <!-- 3D Shadow Base Elevation -->
        <g class="imadlabs-mark" transform="translate(20.00 20.00) scale(1.0000)"><defs><linearGradient id="ilm17g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00FFC2"/><stop offset="1" stop-color="#00D285"/></linearGradient><filter id="ilm17f" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><circle cx="42" cy="28" r="18" fill="#00FFC2" filter="url(#ilm17f)"/><circle cx="42" cy="28" r="8" fill="#FFFFFF"/><path d="M 42 76 L 42 172 L 122 172" fill="none" stroke="url(#ilm17g)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#ilm17f)"/><path d="M 42 80 L 42 168 L 118 168" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
    </g>
    </g><g transform="translate(165, 82)"><text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">Imad<tspan fill="#00F5A0">Labs</tspan></text></g></g></svg>