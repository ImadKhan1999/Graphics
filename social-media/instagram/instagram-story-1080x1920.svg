<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="hc-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="hc-left" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="hc-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#003DB3"/>
    </linearGradient>
    <linearGradient id="bg-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0B1520"/>
    </linearGradient>
    <linearGradient id="accent-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="100%" stop-color="#00FFC2"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1080" height="1920" fill="#070B14"/>
  <!-- Top accent stripe -->
  <rect x="0" y="0" width="1080" height="6" fill="url(#accent-bar)"/>
  <!-- Bottom accent stripe -->
  <rect x="0" y="1914" width="1080" height="6" fill="url(#accent-bar)"/>
  <!-- Corner accents -->
  <path d="M 40 100 L 40 60 L 80 60" stroke="#00F5A0" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 1000 60 L 1040 60 L 1040 100" stroke="#00F5A0" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 40 1820 L 40 1860 L 80 1860" stroke="#00F5A0" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 1000 1860 L 1040 1860 L 1040 1820" stroke="#00F5A0" stroke-width="3" fill="none" opacity="0.6"/>
  <!-- Branding top -->
  <text x="540" y="130" font-family="Plus Jakarta Sans, sans-serif" font-size="32" font-weight="800"
        fill="#F8FAFC" text-anchor="middle">
    Imad<tspan fill="#00F5A0">Labs</tspan>
  </text>
  <!-- Large HexaCore -->
  <g transform="translate(280, 300) scale(2.6)" opacity="0.18">
    
    <g class="imadlabs-mark" transform="translate(52.00 52.00) scale(2.6000)"><defs><linearGradient id="ilm66g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00FFC2"/><stop offset="1" stop-color="#00D285"/></linearGradient><filter id="ilm66f" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><circle cx="42" cy="28" r="18" fill="#00FFC2" filter="url(#ilm66f)"/><circle cx="42" cy="28" r="8" fill="#FFFFFF"/><path d="M 42 76 L 42 172 L 122 172" fill="none" stroke="url(#ilm66g)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#ilm66f)"/><path d="M 42 80 L 42 168 L 118 168" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
  <!-- Content center -->
  <text x="540" y="1060" font-family="Plus Jakarta Sans, sans-serif" font-size="80" font-weight="800"
        fill="#F8FAFC" text-anchor="middle">NEW</text>
  <text x="540" y="1150" font-family="Plus Jakarta Sans, sans-serif" font-size="40" font-weight="700"
        fill="#00F5A0" text-anchor="middle">App Name</text>
  <text x="540" y="1220" font-family="Plus Jakarta Sans, sans-serif" font-size="28" fill="#94A3B8"
        text-anchor="middle">Your announcement here</text>
  <!-- CTA button -->
  <rect x="290" y="1300" width="500" height="80" rx="40" fill="#00F5A0"/>
  <text x="540" y="1350" font-family="Plus Jakarta Sans, sans-serif" font-size="26" font-weight="700"
        fill="#000000" text-anchor="middle">Download Now →</text>
  <!-- Feature list -->
  <circle cx="380" cy="1460" r="6" fill="#00F5A0"/>
  <text x="405" y="1467" font-family="Plus Jakarta Sans, sans-serif" font-size="26" fill="#94A3B8">Feature One</text>
  <circle cx="380" cy="1520" r="6" fill="#00FFC2"/>
  <text x="405" y="1527" font-family="Plus Jakarta Sans, sans-serif" font-size="26" fill="#94A3B8">Feature Two</text>
  <circle cx="380" cy="1580" r="6" fill="#38BDF8"/>
  <text x="405" y="1587" font-family="Plus Jakarta Sans, sans-serif" font-size="26" fill="#94A3B8">Feature Three</text>
  <!-- Swipe up / link -->
  <text x="540" y="1800" font-family="Plus Jakarta Sans, sans-serif" font-size="22" fill="#64748B"
        text-anchor="middle">Swipe up · imadlabs.io</text>
</svg>